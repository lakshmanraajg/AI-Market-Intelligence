name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
      # No lockfile is committed yet; exact direct dependency versions make this
      # clean-checkout install deterministic at the declared package level.
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check app tests
      - name: Run API tests
        run: python -m pytest
