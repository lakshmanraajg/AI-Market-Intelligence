services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: bharatiq, POSTGRES_USER: bharatiq, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me} }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: { DATABASE_URL: postgresql+psycopg://bharatiq:${POSTGRES_PASSWORD:-change-me}@postgres:5432/bharatiq, REDIS_URL: redis://redis:6379/0 }
    volumes: [./backend:/app]
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
volumes: { postgres_data: {} }
